[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossverify-bench"
version = "0.2.0"
description = "Multi-Agent Cross-Verification & Heterogeneous Routing Pareto Efficiency Benchmark"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "WenNinghan"}
]
keywords = [
    "multi-agent-systems",
    "cross-verification",
    "pareto-optimality",
    "llm-routing",
    "markov-chains",
    "benchmark"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crossverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
